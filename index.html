<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2½ Strikers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a0e;
  --card:#0f1318;
  --card2:#141920;
  --border:#1e252f;
  --border2:#252e3a;
  --green:#00ff87;
  --green-dim:rgba(0,255,135,0.08);
  --green-glow:rgba(0,255,135,0.25);
  --red:#ff3d5a;
  --red-dim:rgba(255,61,90,0.08);
  --gold:#ffd166;
  --gold-dim:rgba(255,209,102,0.1);
  --text:#eef0f3;
  --text2:#8b95a1;
  --text3:#4a5568;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100%;-webkit-font-smoothing:antialiased}

.pitch-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:0.03}
.pitch-bg svg{width:100%;height:100%}

.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 0 4rem}

.header{padding:1.5rem 1.25rem 0;display:flex;align-items:flex-start;justify-content:space-between}
.logo-eyebrow{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.logo-title{font-family:var(--font-display);font-size:36px;letter-spacing:0.04em;line-height:1;color:var(--text)}
.logo-title em{color:var(--green);font-style:normal}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:4px}
.season-chip{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text2);border:1px solid var(--border2);border-radius:4px;padding:4px 10px}
.sync-mini{background:var(--green);color:#080a0e;font-family:var(--font-display);font-size:13px;letter-spacing:0.08em;padding:6px 14px;border:none;border-radius:4px;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:5px}
.sync-mini:hover{opacity:.85}
.sync-mini:disabled{opacity:.4;cursor:not-allowed}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border2) 30%,var(--border2) 70%,transparent);margin:1.25rem 1.25rem 0}

.verdict{margin:1.25rem 1.25rem 0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.875rem 1.25rem;display:flex;flex-direction:column;gap:5px}
.v-line{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.v-line strong{color:var(--text);font-weight:600}
.v-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.v-dot.g{background:var(--green)}
.v-dot.r{background:var(--red)}
.v-dot.y{background:var(--gold)}
.sync-status{font-size:11px;color:var(--text3);margin-top:2px}

.cards{margin:1.25rem 1.25rem 0;display:flex;flex-direction:column;gap:10px}

.pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s;position:relative}
.pcard:hover{border-color:var(--border2);transform:translateX(3px)}
.pcard.first{border-color:rgba(255,209,102,.25)}
.pcard.first:hover{border-color:rgba(255,209,102,.5)}
.pcard.last{border-color:rgba(255,61,90,.18)}
.pcard.last:hover{border-color:rgba(255,61,90,.35)}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border2);border-radius:12px 0 0 12px;transition:background .2s}
.pcard.first::before{background:var(--gold)}
.pcard.last::before{background:var(--red)}

.pcard-inner{padding:1rem 1.25rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:1rem}
.pcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pcard-rank{font-family:var(--font-display);font-size:11px;letter-spacing:0.12em;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.rank-1{background:var(--gold-dim);color:var(--gold)}
.rank-2{background:rgba(139,149,161,.1);color:var(--text2)}
.rank-3{background:var(--red-dim);color:var(--red)}
.pcard-owner{font-size:16px;font-weight:600;color:var(--text);line-height:1}
.pcard-player{font-size:12px;color:var(--text2);margin-top:2px}

.pcard-right{text-align:right}
.pcard-goals{font-family:var(--font-display);font-size:56px;letter-spacing:0.02em;line-height:1;color:var(--text)}
.pcard.first .pcard-goals{color:var(--gold)}
.pcard.last .pcard-goals{color:var(--red)}
.pcard-glbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-top:-2px}
.pcard-arrow{font-size:12px;color:var(--text3);margin-top:6px;transition:color .15s}
.pcard:hover .pcard-arrow{color:var(--green)}

.pcard-bar-wrap{padding:0 1.25rem .875rem;display:flex;align-items:center;gap:8px}
.pcard-bar-bg{flex:1;height:2px;background:var(--border2);border-radius:2px;overflow:hidden}
.pcard-bar-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.pcard.first .pcard-bar-fill{background:var(--gold)}
.pcard.last .pcard-bar-fill{background:var(--red)}
.pcard-bar-pct{font-size:11px;color:var(--text3);min-width:28px;text-align:right}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}

.sheet{background:var(--card);border-radius:18px 18px 0 0;border:1px solid var(--border2);border-bottom:none;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0)}
.overlay.open .sheet{transform:translateY(0)}

.sheet-handle{display:flex;justify-content:center;padding:12px 0 4px}
.sheet-handle-bar{width:36px;height:4px;background:var(--border2);border-radius:2px}

.sheet-header{padding:.75rem 1.25rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sh-name{font-family:var(--font-display);font-size:30px;letter-spacing:.04em;color:var(--text);line-height:1}
.sh-sub{font-size:12px;color:var(--text2);margin-top:3px}
.sh-close{width:32px;height:32px;border-radius:50%;background:var(--border);border:none;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.sh-close:hover{background:var(--border2)}

.sheet-body{padding:1.25rem}

.bio-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem}
@media(max-width:400px){.bio-row{grid-template-columns:repeat(2,1fr)}}
.bio-pill{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.bio-v{font-size:14px;font-weight:600;color:var(--text)}
.bio-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}

.sec-label{font-family:var(--font-display);font-size:13px;letter-spacing:.12em;color:var(--text3);margin-bottom:10px;text-transform:uppercase}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
@media(max-width:400px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.sbox{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center}
.sbox-v{font-family:var(--font-display);font-size:30px;letter-spacing:.02em;color:var(--text)}
.sbox-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.sbox.hl .sbox-v{color:var(--green)}

.radar-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1.25rem}
.radar-ttl{font-family:var(--font-display);font-size:13px;letter-spacing:.12em;color:var(--text3);margin-bottom:2px;text-transform:uppercase}
.radar-sub{font-size:11px;color:var(--text3);margin-bottom:1.25rem;opacity:.6}
.radar-svg{display:block;margin:0 auto}

.fotmob-link{display:block;text-align:center;font-size:12px;color:var(--text3);text-decoration:none;padding:.5rem;transition:color .15s}
.fotmob-link:hover{color:var(--green)}

.sheet-loading{text-align:center;padding:3rem 1.25rem;color:var(--text2);font-size:14px}
.sheet-error{text-align:center;padding:2rem 1.25rem;color:var(--red);font-size:13px;line-height:1.6}

.spin-anim{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.pcard{animation:fadeUp .4s both}
.pcard:nth-child(1){animation-delay:.05s}
.pcard:nth-child(2){animation-delay:.12s}
.pcard:nth-child(3){animation-delay:.19s}
</style>
</head>
<body>

<div class="pitch-bg">
<svg viewBox="0 0 680 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <rect x="40" y="40" width="600" height="820" fill="none" stroke="white" stroke-width="2"/>
  <line x1="40" y1="450" x2="640" y2="450" stroke="white" stroke-width="1.5"/>
  <circle cx="340" cy="450" r="80" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="340" cy="450" r="4" fill="white"/>
  <rect x="200" y="40" width="280" height="110" fill="none" stroke="white" stroke-width="1.5"/>
  <rect x="270" y="40" width="140" height="50" fill="none" stroke="white" stroke-width="1.5"/>
  <rect x="200" y="750" width="280" height="110" fill="none" stroke="white" stroke-width="1.5"/>
  <rect x="270" y="800" width="140" height="50" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="340" cy="130" r="3" fill="white"/>
  <circle cx="340" cy="770" r="3" fill="white"/>
</svg>
</div>

<div class="app">
  <div class="header">
    <div class="logo-block">
      <div class="logo-eyebrow">La apuesta anual</div>
      <div class="logo-title">2&frac12; <em>Strikers</em></div>
    </div>
    <div class="header-right">
      <div class="season-chip">24 / 25</div>
      <button class="sync-mini" id="sync-btn" onclick="syncAll()">
        <span id="sync-icon">↻</span> Actualizar
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="verdict" id="verdict">
    <div class="v-line"><span class="v-dot y"></span> Cargando...</div>
  </div>

  <div class="cards" id="cards"></div>
</div>

<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"><div class="sheet-handle-bar"></div></div>
    <div id="sheet-content">
      <div class="sheet-loading">Cargando perfil...</div>
    </div>
  </div>
</div>

<script>
const PLAYERS = [
  {owner:'Juan Carlos', name:'Luis Su\u00e1rez',    fotmobId:'792303', goles:0, img:'https://fotmob-proxy.obijuang.workers.dev/?type=img&id=792303'},
  {owner:'Adolfo',      name:'Du\u0161an Vlahovi\u0107', fotmobId:'737857', goles:0, img:'https://fotmob-proxy.obijuang.workers.dev/?type=img&id=737857'},
  {owner:'Yeye',        name:'Kylian Mbapp\u00e9',  fotmobId:'701154', goles:0, img:'https://fotmob-proxy.obijuang.workers.dev/?type=img&id=701154'},
];

let state=[];

function load(){
  try{const s=localStorage.getItem('tahs_f');if(s){const d=JSON.parse(s);if(d.length===3)state=d;else state=fresh();}else state=fresh();}
  catch(e){state=fresh();}
}
function fresh(){return PLAYERS.map(p=>({...p}));}
function save(){try{localStorage.setItem('tahs_f',JSON.stringify(state));}catch(e){}}

function ranked(){return [...state].sort((a,b)=>b.goles-a.goles);}
function maxGoals(){return Math.max(...state.map(p=>p.goles),1);}
function allTied(){return state.every(p=>p.goles===state[0].goles);}

function renderCards(){
  const r=ranked();const tied=allTied();const mx=maxGoals();
  document.getElementById('cards').innerHTML=state.map((p,i)=>{
    const pos=tied?-1:r.findIndex(x=>x.fotmobId===p.fotmobId)+1;
    const cls=pos===1?'first':pos===3?'last':'';
    const rankLabel=pos===1?'L\u00edder':pos===2?'En juego':pos===3?'\u00daltimo':'\u2014';
    const rankCls=pos===1?'rank-1':pos===3?'rank-3':'rank-2';
    const pct=Math.round((p.goles/mx)*100);
    return `<div class="pcard ${cls}" onclick="openProfile(${i})">
      <div class="pcard-inner">
        <div style="display:flex;align-items:center;gap:12px;">
          <img src="${p.img}" alt="${p.name}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--border);flex-shrink:0;" onerror="this.style.display='none'">
          <div class="pcard-left">
            <div class="pcard-meta"><span class="pcard-rank ${rankCls}">${rankLabel}</span></div>
            <div class="pcard-owner">${p.owner}</div>
            <div class="pcard-player">${p.name}</div>
          </div>
        </div>
        <div class="pcard-right">
          <div class="pcard-goals">${p.goles}</div>
          <div class="pcard-glbl">goles</div>
          <div class="pcard-arrow">Ver perfil \u2192</div>
        </div>
      </div>
      <div class="pcard-bar-wrap">
        <div class="pcard-bar-bg"><div class="pcard-bar-fill" style="width:${pct}%"></div></div>
        <div class="pcard-bar-pct">${pct}%</div>
      </div>
    </div>`;
  }).join('');
}

function renderVerdict(){
  const r=ranked();const tied=allTied();
  const el=document.getElementById('verdict');
  if(tied){el.innerHTML=`<div class="v-line"><span class="v-dot y"></span> Empate total \u2014 la temporada est\u00e1 abierta</div>`;return;}
  const diff=r[0].goles-r[r.length-1].goles;
  el.innerHTML=`
    <div class="v-line"><span class="v-dot r"></span> <strong>${r[r.length-1].owner}</strong> va pagando \u2014 ${r[r.length-1].name}, ${r[r.length-1].goles} goles</div>
    <div class="v-line"><span class="v-dot g"></span> <strong>${r[0].owner}</strong> elige restaurante \u2014 ${r[0].name}, ${r[0].goles} goles</div>
    <div class="v-line"><span class="v-dot y"></span> Diferencia: <strong>${diff} gol${diff!==1?'es':''}</strong></div>`;
}

function render(){renderCards();renderVerdict();}

async function syncAll(){
  const btn=document.getElementById('sync-btn');
  const icon=document.getElementById('sync-icon');
  btn.disabled=true;icon.className='spin-anim';icon.textContent='\u21bb';
  let ok=0,fail=0;
  for(let i=0;i<state.length;i++){
    try{state[i].goles=await fetchGoals(state[i].fotmobId);ok++;}
    catch(e){fail++;}
  }
  save();render();
  btn.disabled=false;icon.className='';icon.textContent='\u21bb';
  const t=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const el=document.getElementById('verdict');
  const old=el.querySelector('.sync-status');if(old)old.remove();
  const span=document.createElement('div');span.className='sync-status';
  span.textContent=fail===0?`\u2713 Actualizado a las ${t}`:`${ok} ok \u00b7 ${fail} con error \u00b7 ${t}`;
  el.appendChild(span);
}

async function fetchGoals(id){
  const r=await fetch(`https://fotmob-proxy.obijuang.workers.dev/?id=${id}`);
  if(!r.ok)throw new Error();
  const d=await r.json();
  let g=0;
  const entries=(d?.careerStatistics?.seasonEntries||[])[0]?.entries||[];
  for(const e of entries)g+=(e.stats?.Goals||0);
  return g;
}

async function openProfile(idx){
  const p=state[idx];
  const overlay=document.getElementById('overlay');
  const sc=document.getElementById('sheet-content');
  sc.innerHTML=`<div class="sheet-loading"><span class="spin-anim">\u21bb</span> Cargando ${p.name}...</div>`;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
  try{
    const r=await fetch(`https://fotmob-proxy.obijuang.workers.dev/?id=${p.fotmobId}`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    sc.innerHTML=buildProfile(p,d);
  }catch(e){
    sc.innerHTML=`
      <div class="sheet-header">
        <div><div class="sh-name">${p.name}</div><div class="sh-sub">Para ${p.owner}</div></div>
        <button class="sh-close" onclick="closeProfile()">\u2715</button>
      </div>
      <div class="sheet-error">
        No se pudo conectar con FotMob.<br>Puede ser un problema de CORS.<br><br>
        <a href="https://www.fotmob.com/players/${p.fotmobId}" target="_blank" style="color:var(--green);text-decoration:none;">Ver en FotMob \u2192</a>
      </div>`;
  }
}

function buildProfile(p,d){
  const info=d?.playerInformation||{};
  const team=d?.primaryTeam?.teamName||'\u2014';
  const age=info?.age?.fallback||'\u2014';
  const height=info?.height?.fallback||'\u2014';
  const foot=info?.preferredFoot?.fallback||'\u2014';
  const nat=info?.nationality?.country||'\u2014';
  const shirt=d?.shirtNumber||'\u2014';
  const contract=info?.contractUntil?.fallback||'\u2014';
  const sdata=d?.mainLeague?.stats?.statsData||[];
  const gv=sv(sdata,'Goals')??p.goles;
  const av=sv(sdata,'Assists')??'\u2014';
  const pjv=sv(sdata,'Matches played')??'\u2014';
  const mv=sv(sdata,'Minutes played');
  const sov=sv(sdata,'Shots on target')??'\u2014';
  const xgv=sv(sdata,'Expected goals (xG)')??'\u2014';
  const radarHTML=buildRadar(d);
  return `
    <div class="sheet-header">
      <div><div class="sh-name">${p.name}</div><div class="sh-sub">${team} \u00b7 Elegido por ${p.owner}</div></div>
      <button class="sh-close" onclick="closeProfile()">\u2715</button>
    </div>
    <div class="sheet-body">
      <div class="sec-label">Perfil</div>
      <div class="bio-row">
        <div class="bio-pill"><div class="bio-v">${age}</div><div class="bio-l">Edad</div></div>
        <div class="bio-pill"><div class="bio-v">${height}</div><div class="bio-l">Altura</div></div>
        <div class="bio-pill"><div class="bio-v">${shirt}</div><div class="bio-l">Dorsal</div></div>
        <div class="bio-pill"><div class="bio-v">${foot}</div><div class="bio-l">Pie</div></div>
        <div class="bio-pill"><div class="bio-v">${nat}</div><div class="bio-l">Pa\u00eds</div></div>
        <div class="bio-pill"><div class="bio-v">${contract}</div><div class="bio-l">Contrato</div></div>
      </div>
      <div class="sec-label">Temporada 24/25</div>
      <div class="stat-row">
        <div class="sbox hl"><div class="sbox-v">${gv}</div><div class="sbox-l">Goles</div></div>
        <div class="sbox"><div class="sbox-v">${av}</div><div class="sbox-l">Asist.</div></div>
        <div class="sbox"><div class="sbox-v">${pjv}</div><div class="sbox-l">PJ</div></div>
        <div class="sbox"><div class="sbox-v">${mv!==null?mv+'\u2032':'\u2014'}</div><div class="sbox-l">Minutos</div></div>
      </div>
      <div class="sec-label">M\u00e1s stats</div>
      <div class="stat-row" style="grid-template-columns:repeat(2,1fr);margin-bottom:1.25rem">
        <div class="sbox"><div class="sbox-v">${sov}</div><div class="sbox-l">Tiros a puerta</div></div>
        <div class="sbox"><div class="sbox-v">${xgv}</div><div class="sbox-l">xG</div></div>
      </div>
      ${radarHTML}
      <a class="fotmob-link" href="https://www.fotmob.com/players/${p.fotmobId}" target="_blank">Ver perfil completo en FotMob \u2192</a>
    </div>`;
}

function sv(arr,key){
  const f=arr.find(x=>x.title===key||x.key===key||x.name===key);
  if(!f)return null;
  const v=f.value?.numberValue??f.value?.fallback;
  return v!=null?v:null;
}

function buildRadar(d){
  let traits=null;
  if(Array.isArray(d?.playerTraits)&&d.playerTraits.length>2)traits=d.playerTraits;
  else if(Array.isArray(d?.traits)&&d.traits.length>2)traits=d.traits;
  else if(Array.isArray(d?.radarData)&&d.radarData.length>2)traits=d.radarData;
  if(!traits){
    return `<div class="radar-card">
      <div class="radar-ttl">Rasgos del jugador</div>
      <div style="padding:1.5rem 0;text-align:center;color:var(--text3);font-size:12px">Datos de percentiles no disponibles</div>
    </div>`;
  }
  const data=traits.map(t=>({
    label:t.title||t.name||'',
    val:Math.min(100,Math.max(0,Math.round(t.value||t.percentile||0)))
  })).slice(0,6);
  const N=data.length;
  if(N<3)return '';
  const cx=150,cy=140,R=95;
  const angles=data.map((_,i)=>(Math.PI*2*i/N)-Math.PI/2);
  const pt=(i,pct)=>{const rr=R*(pct/100);return[cx+rr*Math.cos(angles[i]),cy+rr*Math.sin(angles[i])];};
  const ps=(i,pct)=>{const[x,y]=pt(i,pct);return`${x.toFixed(1)},${y.toFixed(1)}`;};
  let rings='';
  [25,50,75,100].forEach(v=>{
    const pts=data.map((_,i)=>ps(i,v)).join(' ');
    rings+=`<polygon points="${pts}" fill="none" stroke="#1e252f" stroke-width="${v===100?1:.5}"/>`;
  });
  let axes='';
  data.forEach((_,i)=>{const[x,y]=pt(i,100);axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#1e252f" stroke-width=".5"/>`;});
  const dpts=data.map((_,i)=>ps(i,_.val)).join(' ');
  const poly=`<polygon points="${dpts}" fill="rgba(0,255,135,.12)" stroke="#00ff87" stroke-width="1.5"/>`;
  let dots='',labels='';
  data.forEach((d,i)=>{
    const[x,y]=pt(i,d.val);
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#00ff87"/>`;
    const[lx,ly]=pt(i,123);
    const anc=lx<cx-4?'end':lx>cx+4?'start':'middle';
    labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anc}" font-size="9" fill="#4a5568" font-family="DM Sans,sans-serif">${d.label}</text>`;
    labels+=`<text x="${x.toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="#00ff87" font-family="Bebas Neue,sans-serif">${d.val}%</text>`;
  });
  return `<div class="radar-card">
    <div class="radar-ttl">Rasgos del jugador</div>
    <div class="radar-sub">Percentiles vs delanteros de su liga</div>
    <svg class="radar-svg" viewBox="0 0 300 280" width="100%" style="max-width:300px">
      ${rings}${axes}${poly}${dots}${labels}
    </svg>
  </div>`;
}

function closeProfile(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}
function onOverlayClick(e){
  if(e.target===document.getElementById('overlay'))closeProfile();
}

load();render();
</script>
</body>
</html>
